[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag"
version = "0.1.0"
description = "Two-agent RAG system (Data Retriever + Report Generator) built with the OpenAI Agents SDK"
requires-python = ">=3.10"
dependencies = [
    "openai-agents>=0.18",
    "openai>=1.68",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentic-rag = "agentic_rag.main:run"

[tool.setuptools.packages.find]
where = ["src"]
